name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q mBAB searchapp
      - run: python manage.py check
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput

  sites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: find ../searchapp/static/searchapp/scripts/search -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run build:legacy-css && git diff --exit-code -- ../searchapp/static/searchapp/stylesheets/styles.css
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:dependencies
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run test:built
