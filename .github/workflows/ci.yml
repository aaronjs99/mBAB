name: PythonAnywhere branch layout

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  legacy-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the standalone application layout
        run: |
          test -f manage.py
          test -f searchapp/views.py
          test ! -e sites/package.json
          python -m compileall -q mBAB searchapp
